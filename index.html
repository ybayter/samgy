<div id="vista-fichas" class="vista-seccion activo">
  <h2>🗂️ Módulo de Fichas Estudiantiles</h2>
  <br>

  <div class="search-container">
    <h3>🔍 Consultar Ficha Médica Rápidamente</h3>
    <div class="search-box">
      <input type="text" id="inputBusqueda" placeholder="Buscar por nombre o número de documento...">
      <button type="button" id="btnBuscar" class="btn btn-white" style="background-color: var(--header-bg); color: white;">Buscar</button>
    </div>
    <div id="mensajeResultado"></div>
  </div>

  <div class="form-container">
    <h3 id="tituloFormulario">➕ Registrar Nuevo Estudiante</h3>
    <form id="formEstudiante">
      <input type="hidden" id="regId">
      
      <div class="form-grid">
        <div class="form-group">
          <label for="regNombre">Nombre completo:</label>
          <input type="text" id="regNombre" placeholder="Ej: Juan Pérez" required>
        </div>

        <div class="form-group">
          <label for="regDocumento">Documento de identidad:</label>
          <input type="text" id="regDocumento" placeholder="Ej: 1001234567" required>
        </div>

        <div class="form-group">
          <label for="regGrado">Grado escolar:</label>
          <select id="regGrado" required>
            <option value="">Selecciona un grado...</option>
            <option value="6°A">6°A</option>
            <option value="10°">10°</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regSangre">Tipo de sangre:</label>
          <input type="text" id="regSangre" placeholder="Ej: O+" required>
        </div>

        <div class="form-group">
          <label for="regAlergias">Alergias / Condiciones:</label>
          <input type="text" id="regAlergias" placeholder="Ej: Penicilina o Ninguna">
        </div>

        <div class="form-group">
          <label for="regTutor">Nombre y Teléfono del Tutor:</label>
          <input type="text" id="regTutor" placeholder="Ej: Carlos Pérez (3001234567)" required>
        </div>

        <div class="form-actions">
          <button type="submit" id="btnGuardar" class="btn btn-white" style="background-color: var(--header-bg); color: white;">Guardar Ficha en Sistema</button>
          <button type="button" id="btnCancelarEdicion" class="btn btn-outline" style="display: none; color: var(--text-dark); border-color: var(--border-color);">Cancelar</button>
        </div>
      </div>
    </form>
    <p id="mensajeGuardado" style="margin-top: 10px;"></p>
  </div>

  <h3>📂 Directorio de Estudiantes (Clasificado por Grados)</h3>
  <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">
    Fichas activas distribuidas en casillas organizadas según el grado escolar correspondiente.
  </p>
  <div id="contenedorGrados"></div>
</div>
